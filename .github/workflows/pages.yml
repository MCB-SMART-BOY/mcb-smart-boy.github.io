# This repository owns both the website source and its Pages deployment.
# Configure this repository's Pages source as GitHub Actions before dispatching.
# A push to main publishes that commit; workflow_dispatch publishes an explicit commit.
name: Publish personal website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full lowercase 40-character commit SHA from MCB-SMART-BOY/mcb-smart-boy.github.io
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'MCB-SMART-BOY/mcb-smart-boy.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source commit
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.source_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            sha="$INPUT_SHA"
          else
            sha="$EVENT_SHA"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'source commit must be a full lowercase 40-character hexadecimal SHA' >&2
            exit 2
          }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Check out this website at the resolved commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Record checked-out source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          [[ "$actual_sha" == "$SOURCE_SHA" ]] || {
            echo 'Checked-out source commit differs from the resolved commit' >&2
            exit 1
          }
          mkdir -p run/provenance
          printf '%s\n' "$actual_sha" > run/provenance/source-sha.txt
          printf 'Source commit: %s\n' "$actual_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare rolling nightly for this checkout
        run: rustup toolchain install nightly --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Install and verify site build tools
        run: cargo xtask setup
      - name: Record actual compiler and build tool versions
        shell: bash
        run: |
          set -euo pipefail
          {
            rustc -vV
            cargo --version
            cargo-leptos --version
            wasm-bindgen --version
            wasm-opt --version
          } > run/provenance/tool-versions.txt
      - name: Validate and export static pages
        run: cargo xtask check
      - name: Upload source and tool provenance (not part of the site)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-and-tool-provenance
          path: run/provenance/
          if-no-files-found: error
          retention-days: 30
      - name: Upload same-run Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: run/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact built in this run
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
